name: Docker Build (Reusable)

on:
  workflow_call:
    inputs:
      module_name:
        required: true
        type: string
        description: "Module name to build"
      module_path:
        required: true
        type: string
        description: "Module path relative to repo root"
      dockerfile:
        required: true
        type: string
        description: "Dockerfile to build (relative to module_path)"
      skip_build:
        required: false
        type: boolean
        default: false
        description: "Skip the build step"
      build_args:
        required: false
        type: string
        description: "Additional build arguments (--arg KEY=VALUE format)"
      platforms:
        required: false
        type: string
        default: "linux/amd64"
        description: "Platforms to build for (comma-separated)"

jobs:
  build:
    name: Build ${{ inputs.module_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Skip build if requested
        if: inputs.skip_build
        run: |
          echo "⏭️  Skipped build for ${{ inputs.module_name }}"
          exit 0

      - name: Set up QEMU for ARM64 support
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: |
            image=moby/buildkit:latest
            network=host

      - name: Build Docker image
        id: build
        run: |
          MODULE="${{ inputs.module_name }}"
          MODULE_PATH="${{ inputs.module_path }}"
          DOCKERFILE="${{ inputs.dockerfile }}"
          BUILD_ARGS="${{ inputs.build_args }}"
          PLATFORMS="${{ inputs.platforms }}"

          FULL_DOCKERFILE="$MODULE_PATH/$DOCKERFILE"

          if [ ! -f "$FULL_DOCKERFILE" ]; then
            echo "❌ Dockerfile not found: $FULL_DOCKERFILE"
            exit 1
          fi

          echo "🔨 Building $MODULE..."
          echo "  Path: $MODULE_PATH"
          echo "  Dockerfile: $DOCKERFILE"
          echo "  Platforms: $PLATFORMS"

          # 準備構建命令
          BUILD_CMD="docker buildx build"

          # 添加平台
          BUILD_CMD="$BUILD_CMD --platform $PLATFORMS"

          # 添加構建參數
          if [ -n "$BUILD_ARGS" ]; then
            BUILD_CMD="$BUILD_CMD $BUILD_ARGS"
          fi

          # 添加標籤和標籤
          BUILD_CMD="$BUILD_CMD --tag agx:$MODULE"
          BUILD_CMD="$BUILD_CMD --label module=$MODULE"
          BUILD_CMD="$BUILD_CMD --label dockerfile=$DOCKERFILE"
          BUILD_CMD="$BUILD_CMD --label build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 添加文件路徑和 Dockerfile
          BUILD_CMD="$BUILD_CMD -f $FULL_DOCKERFILE $MODULE_PATH"

          # 針對單平台構建添加 --load（包括 amd64 和 arm64）
          # 只有多平台構建（使用逗號分隔）時才不添加 --load
          if ! echo "$PLATFORMS" | grep -q ','; then
            # 單平台構建：amd64 或 arm64
            BUILD_CMD="$BUILD_CMD --load"
          else
            # 多平台構建：緩存在 builder context 中，無法直接加載
            echo "⚠️  Multi-platform build detected - using builder cache"
          fi

          echo "Running: $BUILD_CMD"
          eval "$BUILD_CMD"

          echo "build_success=true" >> $GITHUB_OUTPUT

      - name: Clean up Docker resources
        if: always()
        run: |
          echo "🧹 Cleaning up Docker resources..."
          docker system prune -a -f || true
          docker builder prune -a -f || true

      - name: Build summary
        if: steps.build.outputs.build_success == 'true'
        run: |
          echo "## Build Results for ${{ inputs.module_name }}"
          echo ""
          echo "✅ **Status**: Success"
          echo ""
          echo "| Property | Value |"
          echo "|----------|-------|"
          echo "| Module   | ${{ inputs.module_name }} |"
          echo "| Path     | ${{ inputs.module_path }} |"
          echo "| Dockerfile | ${{ inputs.dockerfile }} |"
          echo "| Platforms | ${{ inputs.platforms }} |"
          echo "| Image    | agx:${{ inputs.module_name }} |"

      - name: Build failed
        if: failure()
        run: |
          echo "❌ Build failed for ${{ inputs.module_name }}"
          exit 1
