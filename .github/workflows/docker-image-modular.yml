name: Docker Image CI (Modular)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 步驟 1: 偵測改動的模組
  # ============================================================================
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules-json: ${{ steps.detect.outputs.modules_json }}
      modules-csv: ${{ steps.detect.outputs.modules_csv }}
      has-changes: ${{ steps.detect.outputs.has_changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Detect changed modules
        id: detect
        run: |
          python .github/scripts/detect_changes.py \
            --base origin/main \
            --head HEAD \
            --root . \
            --output-json > /tmp/changes.json

          # 解析 JSON 輸出
          MODULES=$(python -c "import json; f=open('/tmp/changes.json'); print(','.join(json.load(f).get('ordered_modules', [])))")
          MODULES_JSON=$(cat /tmp/changes.json | python -c "import sys, json; print(json.dumps(json.load(sys.stdin)['ordered_modules']))")
          HAS_CHANGES=$([[ -z "$MODULES" ]] && echo "false" || echo "true")

          echo "modules_csv=$MODULES" >> $GITHUB_OUTPUT
          echo "modules_json=$MODULES_JSON" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

          echo "📊 Detected changed modules: $MODULES"

      - name: Generate build matrix
        id: matrix
        run: |
          MODULES_JSON='${{ steps.detect.outputs.modules_json }}'

          # 生成 matrix 格式
          MATRIX=$(python3 << 'EOF'
          import json

          modules_str = '''${{ steps.detect.outputs.modules_json }}'''
          if not modules_str or modules_str == '[]':
            modules = []
          else:
            modules = json.loads(modules_str)

          matrix = {
            "module": modules,
            "include": [{"module": m} for m in modules]
          }
          print(json.dumps(matrix))
          EOF
          )

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  # ============================================================================
  # 步驟 2: 初始化 CI 環境 (一次性)
  # ============================================================================
  setup:
    name: Setup CI Environment
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU for ARM64 support
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: |
            image=moby/buildkit:latest
            network=host

  # ============================================================================
  # TIER 1: 核心基礎模組 (優先構建)
  # ============================================================================
  build-ros1_ws_base:
    name: Build ros1_ws_base
    needs: [setup, detect-changes]
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      contains(needs.detect-changes.outputs.modules-csv, 'ros1_ws_base')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Dockerfiles (Syntax Verification)
        run: |
          echo "🔍 Linting ros1_ws_base Dockerfiles..."
          for dockerfile in Dockerfile Dockerfile.l4t; do
            if [ -f "ros1_ws/base/$dockerfile" ]; then
              echo "  ✓ $dockerfile"
              docker run --rm -i hadolint/hadolint < "ros1_ws/base/$dockerfile" || echo "  ⚠️  Found warnings"
            fi
          done

      - name: Build Dockerfiles (Build Verification)
        run: |
          echo "🔨 Building ros1_ws_base..."
          for dockerfile in Dockerfile Dockerfile.l4t; do
            if [ -f "ros1_ws/base/$dockerfile" ]; then
              echo "  📦 Building with $dockerfile..."
              docker build ros1_ws/base -f "ros1_ws/base/$dockerfile" \
                --tag "agx:ros1_ws_base" \
                --label "module=ros1_ws_base" \
                --label "dockerfile=$dockerfile"
            fi
          done
          docker system prune -a -f

  # ============================================================================
  # TIER 2: ROS 控制服務 (依賴 ros1_ws_base)
  # ============================================================================
  build-ros1_ws_bridge:
    name: Build ros1_ws_bridge
    needs: [build-ros1_ws_base, detect-changes]
    if: |
      (needs.detect-changes.outputs.has-changes == 'true' &&
      contains(needs.detect-changes.outputs.modules-csv, 'ros1_ws_bridge')) ||
      contains(needs.detect-changes.outputs.modules-csv, 'ros1_ws_base')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Dockerfile
        run: |
          echo "🔍 Linting ros1_ws_bridge..."
          docker run --rm -i hadolint/hadolint < "ros1_ws/bridge/Dockerfile" || echo "  ⚠️  Found warnings"

      - name: Build Dockerfile
        run: |
          echo "🔨 Building ros1_ws_bridge..."
          docker build ros1_ws/bridge -f "ros1_ws/bridge/Dockerfile" \
            --tag "agx:ros1_ws_bridge" \
            --label "module=ros1_ws_bridge"
          docker system prune -a -f

  build-ros1_ws_control:
    name: Build ros1_ws_control
    needs: [build-ros1_ws_base, detect-changes]
    if: |
      (needs.detect-changes.outputs.has-changes == 'true' &&
      contains(needs.detect-changes.outputs.modules-csv, 'ros1_ws_control')) ||
      contains(needs.detect-changes.outputs.modules-csv, 'ros1_ws_base')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Dockerfile
        run: |
          echo "🔍 Linting ros1_ws_control..."
          docker run --rm -i hadolint/hadolint < "ros1_ws/control/Dockerfile" || echo "  ⚠️  Found warnings"

      - name: Build Dockerfile
        run: |
          echo "🔨 Building ros1_ws_control..."
          docker build ros1_ws/control -f "ros1_ws/control/Dockerfile" \
            --progress=plain \
            --tag "agx:ros1_ws_control" \
            --label "module=ros1_ws_control" \
            --build-arg BUILDKIT_INLINE_CACHE=1
          docker system prune -a -f

  # ============================================================================
  # TIER 3: 應用服務 (獨立構建，可並行)
  # ============================================================================
  build-applications:
    name: Build ${{ matrix.module }}
    needs: [setup, detect-changes]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check if module needs build
        id: check
        run: |
          MODULE="${{ matrix.module }}"
          # 檢查模組是否在応用層 (tier 3) 並且不在測試中
          case $MODULE in
            alpamayo)
              echo "should_build=false" >> $GITHUB_OUTPUT
              ;;
            vlm|planning|foxglove|nanollm|dashboard)
              echo "should_build=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "should_build=false" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Lint Dockerfile
        if: steps.check.outputs.should_build == 'true'
        run: |
          MODULE="${{ matrix.module }}"
          echo "🔍 Linting $MODULE..."
          docker run --rm -i hadolint/hadolint < "$MODULE/Dockerfile" || echo "  ⚠️  Found warnings"

      - name: Build Dockerfile
        if: steps.check.outputs.should_build == 'true'
        run: |
          MODULE="${{ matrix.module }}"
          echo "🔨 Building $MODULE..."
          docker build "$MODULE" -f "$MODULE/Dockerfile" \
            --tag "agx:$MODULE" \
            --label "module=$MODULE"
          docker system prune -a -f

      - name: Skip unsupported module
        if: steps.check.outputs.should_build != 'true'
        run: |
          MODULE="${{ matrix.module }}"
          if [ "$MODULE" = "alpamayo" ]; then
            echo "⏭️  Skipping $MODULE (still in testing phase)"
          else
            echo "⏭️  Skipping $MODULE (not in tier 3)"
          fi

  # ============================================================================
  # 最終確認: 所有構建完成
  # ============================================================================
  verify:
    name: Verify All Builds ✅
    needs: [detect-changes, build-ros1_ws_base, setup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          echo "🎉 CI Pipeline Complete!"
          echo ""
          echo "Summary:"
          echo "  Base Setup:      ✅ $([ '${{ needs.setup.result }}' = 'success' ] && echo PASSED || echo FAILED)"
          echo "  Change Detection: ✅ $([ '${{ needs.detect-changes.result }}' = 'success' ] && echo PASSED || echo FAILED)"
          echo ""
          echo "Modules Detected:"
          echo "${{ needs.detect-changes.outputs.modules-csv }}"

      - name: Report metrics
        run: |
          echo "📊 Build Metrics"
          echo "  Total jobs: ~6 (depends on modules)"
          echo "  Parallelization: 3-4 concurrent builds"
          echo "  Estimated time: 30-45 minutes"

      - name: Failed builds alert
        if: |
          needs.build-ros1_ws_base.result == 'failure' ||
          needs.detect-changes.result == 'failure'
        run: |
          echo "❌ Build pipeline failed!"
          exit 1
