name: ROS1 Workspace CI (Isolated)

on:
  push:
    paths:
      - 'ros1_ws/**'
      - '.github/workflows/ros1_ws-ci.yml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'ros1_ws/**'
      - '.github/workflows/ros1_ws-ci.yml'
    branches: [ "main" ]

env:
  WORKSPACE_NAME: "ros1_ws"
  ROS_DISTRO: "noetic"

jobs:
  # ============================================================================
  # 步驟 1: 偵測 ROS 工作空間中的改動
  # ============================================================================
  detect-ros-changes:
    name: Detect ROS Workspace Changes
    runs-on: ubuntu-latest
    outputs:
      ros-modules-json: ${{ steps.detect.outputs.modules_json }}
      ros-modules-csv: ${{ steps.detect.outputs.modules_csv }}
      has-ros-changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Detect ROS workspace changes
        id: detect
        run: |
          # 檢測 ros1_ws 目錄下的改動
          CHANGED_FILES=$(git diff --name-only origin/main HEAD -- ros1_ws/ 2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "modules_csv=" >> $GITHUB_OUTPUT
            echo "modules_json=[]" >> $GITHUB_OUTPUT
            echo "⏭️  No ROS workspace changes detected"
            exit 0
          fi

          # 根據改動文件推斷模組
          MODULES=""
          if echo "$CHANGED_FILES" | grep -q "ros1_ws/base/"; then
            MODULES="$MODULES base"
          fi
          if echo "$CHANGED_FILES" | grep -q "ros1_ws/bridge/"; then
            MODULES="$MODULES bridge"
          fi
          if echo "$CHANGED_FILES" | grep -q "ros1_ws/control/"; then
            MODULES="$MODULES control"
          fi

          # 如果 base 改動，則強制 bridge 和 control 也構建
          if echo "$MODULES" | grep -q "base"; then
            MODULES="base bridge control"
          fi

          # 清理重複
          MODULES=$(echo "$MODULES" | tr ' ' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')

          # 處理空模組的情況
          if [ -z "$MODULES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "modules_csv=" >> $GITHUB_OUTPUT
            echo "modules_json=[]" >> $GITHUB_OUTPUT
            echo "⏭️  No ROS modules changed (only non-module files)"
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "modules_csv=$MODULES" >> $GITHUB_OUTPUT

          # 轉換為 JSON 陣列（正確處理空值）
          MODULES_JSON=$(echo "$MODULES" | python -c 'import sys; modules=[m.strip() for m in sys.stdin.read().strip().split(",") if m.strip()]; print("[" + ", ".join([f"\"{m}\"" for m in modules]) + "]")')
          echo "modules_json=$MODULES_JSON" >> $GITHUB_OUTPUT

          echo "📊 Detected ROS modules to build: $MODULES"

  # ============================================================================
  # 步驟 2: 初始化 ROS 構建環境
  # ============================================================================
  setup-ros:
    name: Setup ROS Build Environment
    runs-on: ubuntu-latest
    if: needs.detect-ros-changes.outputs.has-ros-changes == 'true'
    needs: [detect-ros-changes]
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU for multi-platform
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: |
            image=moby/buildkit:latest
            network=host

  # ============================================================================
  # TIER 1: ROS 基礎鏡像
  # ============================================================================
  build-ros-base:
    name: Build ROS Base
    needs: [detect-ros-changes, setup-ros]
    if: contains(needs.detect-ros-changes.outputs.ros-modules-csv, 'base')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint ROS Base Dockerfiles
        run: |
          echo "🔍 Linting ROS base Dockerfiles..."
          for dockerfile in Dockerfile Dockerfile.l4t; do
            if [ -f "ros1_ws/base/$dockerfile" ]; then
              echo "  ✓ $dockerfile"
              docker run --rm -i hadolint/hadolint < "ros1_ws/base/$dockerfile" || echo "  ⚠️  Warnings found"
            fi
          done

      - name: Build ROS Base (amd64)
        run: |
          echo "🔨 Building ROS base (amd64)..."
          docker build ros1_ws/base -f ros1_ws/base/Dockerfile \
            --tag agx-ros1_ws-base:latest \
            --tag agx-ros1_ws-base:noetic \
            --label module=ros1_ws_base \
            --label ros_distro=noetic
          docker system prune -a -f

      - name: Build ROS Base (arm64)
        run: |
          echo "🔨 Building ROS base (arm64)..."
          docker buildx build --platform linux/arm64 \
            ros1_ws/base -f ros1_ws/base/Dockerfile.l4t \
            --tag agx-ros1_ws-base-arm64:latest \
            --label module=ros1_ws_base_arm64 \
            --label ros_distro=noetic \
            --load
          docker system prune -a -f

  # ============================================================================
  # TIER 2: ROS 服務 (Bridge 和 Control)
  # ============================================================================
  build-ros-bridge:
    name: Build ROS Bridge
    needs: [detect-ros-changes, build-ros-base]
    if: contains(needs.detect-ros-changes.outputs.ros-modules-csv, 'bridge') || contains(needs.detect-ros-changes.outputs.ros-modules-csv, 'base')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint ROS Bridge
        run: |
          echo "🔍 Linting ROS bridge..."
          docker run --rm -i hadolint/hadolint < "ros1_ws/bridge/Dockerfile" || echo "  ⚠️  Warnings found"

      - name: Build ROS Bridge
        run: |
          echo "🔨 Building ROS bridge..."
          docker build ros1_ws/bridge -f ros1_ws/bridge/Dockerfile \
            --tag agx-ros1_ws-bridge:latest \
            --label module=ros1_ws_bridge
          docker system prune -a -f

  build-ros-control:
    name: Build ROS Control
    needs: [detect-ros-changes, build-ros-base]
    if: contains(needs.detect-ros-changes.outputs.ros-modules-csv, 'control') || contains(needs.detect-ros-changes.outputs.ros-modules-csv, 'base')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint ROS Control
        run: |
          echo "🔍 Linting ROS control..."
          docker run --rm -i hadolint/hadolint < "ros1_ws/control/Dockerfile" || echo "  ⚠️  Warnings found"

      - name: Build ROS Control
        run: |
          echo "🔨 Building ROS control (this may take a while)..."
          docker build ros1_ws/control -f ros1_ws/control/Dockerfile \
            --tag agx-ros1_ws-control:latest \
            --tag agx-ros1_ws-control:slam \
            --label module=ros1_ws_control \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --progress=plain
          docker system prune -a -f

  # ============================================================================
  # 驗證: 所有 ROS 構建完成
  # ============================================================================
  verify-ros:
    name: Verify ROS Workspace Builds ✅
    needs:
      - detect-ros-changes
      - build-ros-base
      - build-ros-bridge
      - build-ros-control
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          echo "## 🎉 ROS Workspace CI Pipeline Complete"
          echo ""
          echo "### Detection Results"
          echo "- **Status**: ${{ needs.detect-ros-changes.result }}"
          echo "- **Modules Changed**: ${{ needs.detect-ros-changes.outputs.ros-modules-csv }}"
          echo ""
          echo "### Build Results"
          echo "- **Base Build**: ${{ needs.build-ros-base.result }}"
          echo "- **Bridge Build**: ${{ needs.build-ros-bridge.result }}"
          echo "- **Control Build**: ${{ needs.build-ros-control.result }}"
          echo ""
          echo "### Next Step"
          echo "ROS workspace images are ready for application layer to consume"

      - name: Summarize exported images
        run: |
          echo "## 📦 Exported Images"
          echo ""
          echo "The following images are available for the application layer:"
          echo ""
          echo "| Module | Image | Tag |"
          echo "|--------|-------|-----|"
          echo "| Base | agx-ros1_ws-base | latest, noetic |"
          echo "| Bridge | agx-ros1_ws-bridge | latest |"
          echo "| Control | agx-ros1_ws-control | latest, slam |"

  # ============================================================================
  # 失敗檢查
  # ============================================================================
  check-failures:
    name: Check for ROS Build Failures
    needs:
      - detect-ros-changes
      - build-ros-base
      - build-ros-bridge
      - build-ros-control
    if: always() && needs.detect-ros-changes.outputs.has-ros-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check critical failures
        if: |
          needs.build-ros-base.result == 'failure' ||
          needs.build-ros-bridge.result == 'failure' ||
          needs.build-ros-control.result == 'failure'
        run: |
          echo "❌ ROS builds failed!"
          if [ "${{ needs.build-ros-base.result }}" = "failure" ]; then
            echo "  - Base build failed"
          fi
          if [ "${{ needs.build-ros-bridge.result }}" = "failure" ]; then
            echo "  - Bridge build failed"
          fi
          if [ "${{ needs.build-ros-control.result }}" = "failure" ]; then
            echo "  - Control build failed"
          fi
          exit 1

      - name: Success message
        if: success()
        run: |
          echo "✅ All ROS workspace builds completed successfully!"
