# Nav2 Isaac Sim override — 與 nav2_params_base.yaml 深度合併後使用

amcl:
  ros__parameters:
    alpha1: 0.5
    alpha2: 0.5
    alpha3: 0.5
    alpha4: 0.5

controller_server:
  ros__parameters:
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.2
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.4
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      max_angular_vel: 2.0

behavior_server:
  ros__parameters:
    max_rotational_vel: 2.0
    min_rotational_vel: 0.5

velocity_smoother:
  ros__parameters:
    max_velocity: [1.5, 0.0, 2.5]
    min_velocity: [-0.5, 0.0, -2.5]
    max_accel: [2.5, 0.0, 3.5]
    max_decel: [-2.5, 0.0, -3.5]
    deadband_velocity: [0.05, 0.0, 0.05]
