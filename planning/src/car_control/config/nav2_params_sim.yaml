# Nav2 Isaac Sim override — 與 nav2_params_base.yaml 深度合併後使用

amcl:
  ros__parameters:
    alpha1: 0.5
    alpha2: 0.5
    alpha3: 0.5
    alpha4: 0.5
    # 模擬環境自動設定初始位姿，讓 AMCL 立即發布 map→odom TF
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    FollowPath:
      # 直接使用 RPP，啟用內建原地旋轉（不做旋轉碰撞檢查，避免 RotationShim 靜默失敗）
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.2
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 0.8                 # 動態 lookahead = v * lookahead_time，1.2 m/s → 0.96 m
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.8
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.3
      # 內建原地旋轉：大角度偏差時先轉向再追蹤
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      max_angular_vel: 2.0

behavior_server:
  ros__parameters:
    max_rotational_vel: 2.0
    min_rotational_vel: 0.5

velocity_smoother:
  ros__parameters:
    max_velocity: [1.5, 0.0, 2.0]
    min_velocity: [-0.3, 0.0, -2.0]
    max_accel: [0.6, 0.0, 3.2]
    max_decel: [-3.0, 0.0, -3.2]
    deadband_velocity: [0.02, 0.0, 0.02]
